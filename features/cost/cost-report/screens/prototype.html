<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>월별 비용 화면 설계서</title>
<style>/* OPS 제품 양식 · 화면 설계서와 제품 화면이 함께 쓰는 CSS 한 장
   장 순서: 1 토큰, 2 바탕, 3 제품 틀(왼쪽 메뉴 · 머리말), 4 부품, 5 화면 설계서 틀, 6 좁은 화면.
   포털 양식(tools/site/ds/portal.css)과 따로 둔다. 제품 화면과 포털이 서로 다르게 보여야 어느 쪽이 제품인지 헷갈리지 않는다. */

/* ───────── 1. 토큰 ───────── */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface-2:#f1f1ec; --surface-3:#e7e7e0;
  --ink:#1d1d1b; --ink-2:#4a4a45; --ink-3:#77776f; --line:#e2e2da; --line-2:#cfcfc5;
  --acc:#4338ca; --acc-ink:#3730a3; --acc-soft:#eef0ff; --acc-line:#c7cbf5;
  --nav:#1f1e2e; --nav-ink:#d9d8e8; --nav-ink-2:#9897b0; --nav-on:#ffffff; --nav-hi:#2f2d45;
  /* 상태 색: 정해진 뜻에만 쓴다 */
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --warn:#a15c07; --warn-soft:#fdf1df; --bad:#b42318; --bad-soft:#fde8e6;
  --info:#2e5aac; --info-soft:#e8eefb; --mute:#6b6b63; --mute-soft:#ececE6;
  /* 우선순위 */
  --p1:#b42318; --p2:#c4570c; --p3:#a17c07; --p4:#6b6b63;
  /* 클라우드 계열(차트) */
  --c1:#4338ca; --c2:#0e9384; --c3:#c4570c; --c4:#8a8a80;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --sh:0 1px 2px rgba(29,29,27,.06),0 1px 1px rgba(29,29,27,.04);
  --f:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}

/* ───────── 2. 바탕 ───────── */
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.5 var(--f);color:var(--ink);background:var(--bg);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* ───────── 3. 제품 틀 ───────── */
.app{display:grid;grid-template-columns:208px 1fr;min-height:100%;background:var(--bg)}
.nav{background:var(--nav);color:var(--nav-ink);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.nav .logo{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;color:var(--nav-on);font-weight:800;letter-spacing:.2px}
.nav .logo i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:inline-block}
.nav .grp{font-size:11px;color:var(--nav-ink-2);padding:12px 8px 4px}
.nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--nav-ink);text-decoration:none;font-size:13.5px}
.nav a.on{background:var(--nav-hi);color:var(--nav-on);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .crumb{color:var(--ink-3);font-size:13px}
.top .crumb b{color:var(--ink);font-weight:600}
.top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.top .who i{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.page{padding:20px 24px 32px;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;align-items:flex-end;gap:12px}
.phead h1{font-size:22px}
.phead p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.phead .sp{flex:1}

/* ───────── 4. 부품 ───────── */
.btn{height:34px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card>.hd h2{font-size:15px}
.card>.hd .sp{flex:1}
.card>.bd{padding:12px 16px 16px}

/* 숫자 칸 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--ink-3)}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:3px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}

/* 빠른 보기 · 탭 */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;height:28px;padding:0 12px;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--sh)}
.seg button em{font-style:normal;color:var(--ink-3);margin-left:4px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 0;font-size:13.5px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}

/* 필터 줄 */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sel{height:32px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);padding:0 28px 0 10px;font:inherit;font-size:13px;color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat}
.search{height:32px;border:1px solid var(--line-2);border-radius:var(--r-s);padding:0 10px;font:inherit;font-size:13px;min-width:200px;background:var(--surface)}
.applied{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.applied .tag{display:inline-flex;align-items:center;gap:4px;background:var(--acc-soft);color:var(--acc-ink);border-radius:999px;padding:2px 10px;font-weight:600}

/* 배지 */
.bdg{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.bdg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bdg.ok{background:var(--ok-soft);color:var(--ok)} .bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)} .bdg.info{background:var(--info-soft);color:var(--info)}
.bdg.mute{background:var(--surface-2);color:var(--mute)}
.prio{display:inline-grid;place-items:center;width:28px;height:20px;border-radius:5px;font-size:11.5px;font-weight:800;color:#fff;font-family:var(--mono)}
.prio.P1{background:var(--p1)} .prio.P2{background:var(--p2)} .prio.P3{background:var(--p3)} .prio.P4{background:var(--p4)}

/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#fafaf7}
.tbl tr.sel td{background:var(--acc-soft)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .ttl{font-weight:600}
.tbl .sub{font-size:12px;color:var(--ink-3)}
.tblwrap{overflow:auto;border-radius:0 0 var(--r-l) var(--r-l)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px 16px;font-size:12.5px;color:var(--ink-3)}

/* 경과 막대: 목표 시간 대비 */
.elapsed{display:flex;align-items:center;gap:8px;min-width:150px}
.elapsed .bar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.elapsed .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ok)}
.elapsed .bar i.warn{background:var(--warn)} .elapsed .bar i.bad{background:var(--bad)}
.elapsed span{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}

/* 사이드 패널 */
.split{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
.panel{position:sticky;top:12px}
.panel .hd{flex-wrap:wrap}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 10px;font-size:13px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--acc)}
.tl li b{font-weight:600} .tl li span{display:block;font-size:12px;color:var(--ink-3)}

/* 작은 차트 */
.spark{display:block}
.chart{width:100%;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--acc)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.delta.up{color:var(--bad)} .delta.down{color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-3)}

/* ───────── 5. 화면 설계서 틀 ───────── */
.sb{display:grid;grid-template-rows:auto 1fr;height:100vh;background:#e9e9e3}
.sb-top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.sb-top h1{font-size:15px}
.sb-top .code{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.sb-top .sp{flex:1}
.sb-top .sample{font-size:11.5px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px;font-weight:600}
.sb-scr{display:flex;gap:4px}
.sb-scr button{border:1px solid var(--line);background:var(--surface);border-radius:7px;height:30px;padding:0 12px;font-size:12.5px;color:var(--ink-2)}
.sb-scr button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.sb-body{display:grid;grid-template-columns:1fr 380px;min-height:0}
.sb-canvas{overflow:auto;padding:20px}
.sb-frame{position:relative;width:1280px;max-width:100%;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.08);background:var(--bg)}
.sb-desc{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 40px}
.sb-desc h2{font-size:16px}
.sb-desc .purpose{color:var(--ink-2);font-size:13px;margin:6px 0 14px}
.sb-desc .spot{border-top:1px solid var(--line);padding:12px 0}
.sb-desc .spot h3{display:flex;align-items:center;gap:8px;font-size:13.5px}
.sb-desc .spot ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.sb-desc .spot li{margin:2px 0}
.sb-desc .spot.hi{background:var(--acc-soft);margin:0 -18px;padding:12px 18px}
.sb-desc .ids{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:6px}
.sb-desc .opt{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);margin-top:10px}
.mk{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:800;font-family:var(--mono);padding:0 5px}
.sb-frame .mk{position:absolute;z-index:5;box-shadow:0 0 0 2px #fff;cursor:pointer}
.sb.nomk .sb-frame .mk{display:none}
[data-spot].spot-hi{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* ───────── 6. 좁은 화면 ───────── */
@media (max-width:1100px){.sb-body{grid-template-columns:1fr}.sb-desc{border-left:0;border-top:1px solid var(--line)}.split{grid-template-columns:1fr}.panel{position:static}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.sb-canvas{padding:8px}}

/* 좁은 칸에서 줄이 끊기지 않게 */
.seg button,.tbl .mono,.bdg,.btn{white-space:nowrap}
.card>.hd{flex-wrap:wrap;row-gap:10px}
.split{grid-template-columns:minmax(0,1fr) 330px}
.tbl td.num,.tbl td.r{white-space:nowrap}
</style>
</head>
<body>
<div class="sb" id="sb">
  <div class="sb-top">
    <h1>월별 비용</h1><span class="code">CST</span>
    <div class="sb-scr" id="scrs"></div>
    <span class="sp"></span>
    <span class="sample">예시 데이터</span>
  </div>
  <div class="sb-body">
    <div class="sb-canvas"><div class="sb-frame" id="frame"></div></div>
    <aside class="sb-desc" id="desc"></aside>
  </div>
</div>

function marks() {

    const r = el.getBoundingClientRect(), m = document.createElement('span');
    m.className = 'mk'; m.textContent = el.dataset.spot;

<script>
const D = __DATA__;
const byDoc = Object.fromEntries(D.docs.map(d => [d.id, d]));
const KIND = {qa:'품질 검사 결정', rule:'규칙', open:'미확정', draft:'검토 중 규칙안', fn:'기능', rq:'요구사항', scr:'화면', pl:'정책', oq:'미결정', doc:'정책 문서', review:'논의 필요', cross:'문서 간 충돌', recheck:'담당자 확인 대기', gap:'정책 · 코드 불일치'};
const ids = Object.keys(D.defs).sort((a, b) => b.length - a.length);
const idRe = new RegExp('(?<![A-Za-z0-9-])(' + ids.map(s => s.replace(/[-]/g, '\\-')).join('|') + ')(?![A-Za-z0-9-])', 'g');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = encodeURIComponent;
const planOf = id => D.plans.find(p => p.docs.includes(id));
const isPlanDoc = id => byDoc[id] && byDoc[id].kind === 'plan';
const page = $('#page');

// ───────── md ─────────
function inl(t){
  t = esc(t.replace(/\\([_|*\\\[\]()#.-])/g, '$1'));
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, h) => /^https?:/.test(h) ? `<a href="${h}" target="_blank" rel="noopener">${a}</a>` : /^#\//.test(h) ? `<a href="${h}">${a}</a>` : a);
  return t.replace(/&lt;br&gt;/g, '<br>');
}
// 기능 목록(양식 0.2, 칸 13개)은 기능 하나를 한 덩어리로 보인다
// 기능 하나를 한 덩어리로: 머리(ID · 분류 · 배지) / 이름 / 설명 / 연결(화면 · 정책 · 요구사항 · 비고)을 칸으로 나눈다
function fnCards(h, rs){
  const v = (r, k) => { const i = h.indexOf(k); const x = i < 0 ? '' : (r[i] || ''); return x === '—' ? '' : x; };
  const bdg = (t, c) => t ? `<span class="bdg ${c || ''}">${inl(t)}</span>` : '';
  const row = (k, t, txt) => t ? `<div class="${txt ? 'txt' : ''}"><dt>${k}</dt><dd>${inl(t)}</dd></div>` : '';
  return '<div class="fncards">' + rs.map(r => `<section class="fn">`
    + `<div class="fh"><span class="fid">${esc(v(r, '기능 ID'))}</span><span class="fcat">${inl([v(r, '대분류'), v(r, '중분류')].filter(Boolean).join(' › '))}</span>`
    + `<span class="fchips">${bdg(v(r, '구분'), v(r, '구분') === '신규' ? 'acc' : '')}${bdg(v(r, '우선순위') && '우선 ' + v(r, '우선순위'))}${bdg(v(r, '권한') && '권한 ' + v(r, '권한'))}${bdg(v(r, '난이도') && '난이도 ' + v(r, '난이도'))}</span></div>`
    + `<h4 class="fname">${inl(v(r, '기능명'))}</h4>`
    + `<p class="fdesc">${inl(v(r, '기능 설명'))}</p>`
    + `<dl class="flinks">${row('화면', v(r, '화면 ID'))}${row('정책', v(r, '정책 ID'))}${row('요구사항', v(r, '요구사항 ID'))}${row('비고', v(r, '비고'), true)}</dl></section>`).join('') + '</div>';
}
function md2html(src){
  /* md 주석(<!-- … -->)은 작성 안내라 화면에 싣지 않는다 */
  const L = src.replace(/\r/g,'').replace(/<!--[\s\S]*?-->\n?/g,'').split('\n'), out = []; let i = 0;
  const cells = l => l.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(x => x.trim());
  while (i < L.length){
    const l = L[i];
    if (/^```/.test(l)){ const b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>'); continue; }
    let m = l.match(/^(#{1,6})\s+(.*)$/); if (m){ const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inl(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && i+1<L.length && /^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      const h = cells(l); i += 2; const rs=[];
      while (i<L.length && /^\s*\|/.test(L[i])) rs.push(cells(L[i++]));
      if (h[0] === '기능 ID'){ out.push(fnCards(h, rs)); continue; }
      out.push('<div class="card"><div class="tscroll"><table class="tb"><thead><tr>'+h.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>'); continue; }
    if (/^\s*[-*] /.test(l)){ const it=[]; while(i<L.length && /^\s*[-*] /.test(L[i])) it.push(L[i++].replace(/^\s*[-*] /,'')); out.push('<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>'); continue; }
    if (/^\s*\d+\. /.test(l)){ const it=[]; while(i<L.length && /^\s*\d+\. /.test(L[i])) it.push(L[i++].replace(/^\s*\d+\. /,'')); out.push('<ol>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ol>'); continue; }
    if (/^>\s?/.test(l)){ const b=[]; while(i<L.length && /^>\s?/.test(L[i])) b.push(L[i++].replace(/^>\s?/,'')); out.push('<blockquote>'+inl(b.join(' '))+'</blockquote>'); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l) || !l.trim()){ i++; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^(#{1,6}\s|```|\s*\||\s*[-*] |\s*\d+\. |>)/.test(L[i])) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    out.push('<p>'+inl(p.join(' '))+'</p>');
  }
  return out.join('\n');
}
function idHref(id){ const d = D.defs[id]; return d.kind === 'doc' ? `#/doc/${enc(id)}` : `#/doc/${enc(d.doc)}/${enc(id)}`; }
function linkify(root){
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest('a,pre') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const ns = []; while (w.nextNode()) ns.push(w.currentNode);
  for (const n of ns){
    idRe.lastIndex = 0; if (!idRe.test(n.nodeValue)) continue; idRe.lastIndex = 0;
    const s = document.createElement('span');
    s.innerHTML = esc(n.nodeValue).replace(idRe, id => `<a class="rid" href="${idHref(id)}" title="${esc(KIND[D.defs[id].kind] + ' · ' + D.defs[id].label)}">${id}</a>`);
    n.replaceWith(...s.childNodes);
  }
}
// 문서 본문. 2단계 제목이 넷 이상이면 오른쪽에 목차
// 문서 본문을 읽기 틀로 그린다: 목차 · 본문 · 옆 정보(rail). 제목이 둘 미만이면 목차를 뺀다
function renderDoc(d, el, rail){
  el.innerHTML = `<div class="reading"><article class="doc md">${md2html(d.body)}</article><aside class="aside"><nav class="toc" aria-label="이 페이지 목차"></nav>${rail || ''}</aside></div>`;
  const md = el.querySelector('.md'), toc = el.querySelector('.toc');
  const h1 = md.querySelector('h1'); if (h1 && h1 === md.firstElementChild) h1.remove();
  md.querySelectorAll('h2').forEach(h => {
    if (!h.textContent.trim().startsWith('미확정')) return;
    const box = document.createElement('div'); box.className = 'open'; h.before(box);
    let n = h; while (n && !(n !== h && /^H[12]$/.test(n.tagName))){ const nx = n.nextElementSibling; box.appendChild(n); n = nx; }
  });
  md.querySelectorAll('h1,h2,h3').forEach(h => { const m = h.textContent.match(/([A-Z]{3}-(?:PL|FN)-[A-Z]+-\d+)/); if (m && D.defs[m[1]]) h.id = 'r-' + m[1]; });
  md.querySelectorAll('tr').forEach(tr => {
    const c = tr.querySelector('td'); if (!c) return;
    const id = c.textContent.trim();
    if (!D.defs[id] || D.defs[id].doc !== d.id) return;
    tr.id = 'r-' + id;
    const r = (D.refs[id] || []), fromPlan = r.filter(x => isPlanDoc(x.doc) && x.doc !== d.id).length;
    if (r.length) c.insertAdjacentHTML('beforeend', `<a class="refn" href="#/id/${enc(id)}" title="참조 위치 보기">${d.kind === 'policy' && fromPlan ? '기획 ' + fromPlan + '곳' : '참조 ' + r.length + '곳'}</a>`);
  });
  const hs = [...md.querySelectorAll('h2,h3')];
  if (hs.length >= 2){
    toc.innerHTML = '<div class="gh">이 페이지 목차</div>' + hs.map((h, k) => `<button type="button" class="${h.tagName === 'H3' ? 'l3' : ''}" data-k="${k}">${esc(h.textContent.replace(/(기획|참조) \d+곳$/, ''))}</button>`).join('');
    const bs = [...toc.querySelectorAll('[data-k]')], pg = $('#pg');
    toc.onclick = e => { const b = e.target.closest('[data-k]'); if (b) hs[+b.dataset.k].scrollIntoView({block: 'start'}); };
    const mark = () => { let k = 0; hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 140) k = i; }); bs.forEach((b, i) => b.classList.toggle('on', i === k)); };
    pg.onscroll = mark; mark();
  } else { toc.remove(); $('#pg').onscroll = null; if (!rail) el.firstElementChild.classList.add('solo'); }
  const fns = md.querySelectorAll('.fncards .fn'); if (fns.length){
    const cat = {}; fns.forEach(f => { const c = (f.querySelector('.fcat')?.textContent || '').split('›')[0].trim() || '기타'; cat[c] = (cat[c] || 0) + 1; });
    el.querySelector('.aside').insertAdjacentHTML('beforeend', `<div class="rbox"><h3>기능정의서 요약</h3><div class="qnum"><div><b>${fns.length}</b><span>기능</span></div><div><b>${Object.keys(cat).length}</b><span>영역</span></div></div><p class="mut" style="margin:0;font-size:13px">${Object.entries(cat).map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</p></div>`); }
  linkify(md);
  sizeTables(md);
}
// 문서 표의 칸 폭을 내용 길이에 맞춘다. ID만 든 칸은 좁게 고정하고, 문장이 든 칸에 남는 폭을 준다
function sizeTables(md){
  md.querySelectorAll('table.tb').forEach(tb => {
    const rows = [...tb.querySelectorAll('tbody tr')], n = tb.querySelectorAll('thead th').length; if (!n || !rows.length) return;
    const ws = [];
    for (let c = 0; c < n; c++){
      const cells = rows.map(r => r.children[c]).filter(Boolean), txt = cells.map(x => x.textContent.trim());
      const longest = Math.max(...txt.map(x => x.length), 0), avg = txt.reduce((a, x) => a + x.length, 0) / (txt.length || 1);
      const px = w => [...w].reduce((a, ch) => a + (/[가-힣]/.test(ch) ? 15.5 : 8.6), 0);   // 낱말 하나가 차지하는 폭
      const word = Math.max(...txt.map(x => Math.max(...x.split(/[\s,·›>]+/).map(px), 0)), px(tb.querySelectorAll('thead th')[c].textContent.trim()));
      const idOnly = txt.every(x => !x || /^[A-Za-z0-9 ._,\-()/—]+$/.test(x.replace(/(기획|참조) \d+곳$/, '')));
      const one = idOnly && longest <= 30;            // ID 하나짜리 칸
      cells.forEach(x => { if (one) x.classList.add('idc'); if (x.textContent.trim() === '—' || x.textContent.trim() === '-') x.classList.add('nil'); });
      ws.push(one ? {fix: Math.min(180, Math.max(64, word + 30))} : idOnly ? {w: 26, min: Math.min(280, word + 30)} : {w: Math.min(46, Math.max(12, Math.sqrt(avg) * 3.6)), min: Math.min(260, Math.max(110, word + 30))});
    }
    const sum = ws.reduce((a, x) => a + (x.w || 0), 0) || 1, fixed = ws.reduce((a, x) => a + (x.fix || 0), 0);
    const minW = fixed + ws.reduce((a, x) => a + (x.min || 0), 0);
    tb.style.tableLayout = 'fixed'; tb.style.minWidth = Math.round(minW) + 'px';
    const cg = document.createElement('colgroup');
    cg.innerHTML = ws.map(x => x.fix ? `<col style="width:${Math.round(x.fix)}px">` : `<col style="width:${(x.w / sum * 100).toFixed(1)}%">`).join('');
    tb.prepend(cg);
  });
}
// ───────── 양식 부품을 그리는 작은 함수 ─────────
// 쪽 머리(.ptitle) + 쪽 탭(.ptabs): 제목 + 탭 [키, 이름, 주소, 건수]
let BAND = {};
const head = o => { Object.assign(BAND, o); return ''; };
const pgtabs = (title, tabs, on) => head({title, tabs, on});
const SECK = {'홈': 'home', '기획': 'plans', '결정할 것': 'open', '품질': 'qa', '공통 정책': 'policies', '가이드': 'guides'};
function drawBand(){
  const b = BAND, c = b.crumb || [], el = $('#band');
  const lead = page.firstElementChild && page.firstElementChild.matches('p.lead') ? page.firstElementChild : null;
  el.className = 'band' + (b.tabs && b.tabs.length ? '' : ' solo') + (b.lift ? ' lift' : '');
  const here = decodeURIComponent(location.hash || '#/');
  const up = [...c.slice(0, -1)].reverse().find(x => x[1] && decodeURIComponent(x[1]) !== here);   // 바로 위 쪽: 「← 이전」 버튼이 간다
  el.innerHTML = `<div class="wrap">${c.length > 1 ? `<nav class="crumb" aria-label="위치">${up ? `<a class="back" href="${up[1]}" aria-label="${up[2] || up[0]}로 돌아가기"><span aria-hidden="true">←</span>${up[2] || up[0]}</a><i class="bar"></i>` : ''}<ol class="lv">${c.map((x, i) => { const last = i === c.length - 1, k = i === 0 ? SECK[x[0]] : '', ic = k ? `<span class="gi gi-${k}"><svg class="ic"><use href="#i-n-${k}"/></svg></span>` : '';
      return `<li${last ? ' aria-current="page"' : ''}>${last ? `<b>${ic}${x[0]}</b>` : x[1] ? `<a href="${x[1]}">${ic}${x[0]}</a>` : `<span>${ic}${x[0]}</span>`}</li>`; }).join('<li class="sep" aria-hidden="true"><svg class="ic"><use href="#i-chev"/></svg></li>')}</ol></nav>` : ''}
    <div class="ptitle"><h1 class="${b.mono ? 'mono' : ''}">${b.title || (c.length ? c[c.length - 1][0] : '')}</h1>${b.badge || ''}</div>${b.meta ? `<div class="meta">${b.meta}</div>` : ''}<span id="bandlead"></span>${b.now ? `<div class="now">${b.now}</div>` : ''}
    ${b.tabs && b.tabs.length ? `<nav class="ptabs" aria-label="쪽 탭">${b.tabs.map(([k, t, h, n]) => `<a class="${k === b.on ? 'on' : ''}" href="${h}">${esc(t)}${n !== undefined && n !== '' ? `<em>${n}</em>` : ''}</a>`).join('')}</nav>` : ''}</div>`;
  if (lead) $('#bandlead').replaceWith(lead); else $('#bandlead').remove();
  document.documentElement.style.setProperty('--bandh', el.offsetHeight + 'px');
}
window.addEventListener('resize', () => { const el = $('#band'); if (el) document.documentElement.style.setProperty('--bandh', el.offsetHeight + 'px'); });
// 카드(.card .hd .bd). raw 면 본문을 .bd 없이(표를 꽉 채울 때)
const card = (h2, body, opt = {}) => `<div class="card ${opt.cls || ''}">${h2 ? `<div class="hd"><h2>${h2}</h2>${opt.small ? `<small>${opt.small}</small>` : ''}${opt.right ? `<span style="margin-left:auto">${opt.right}</span>` : ''}</div>` : ''}${opt.raw ? body : `<div class="bd">${body}</div>`}</div>`;
// 표(.tscroll .tb) + 도구줄(.tbar)
const table = (head, rows, opt = {}) => `<div class="card">${opt.tbar ? `<div class="tbar">${opt.tbar}</div>` : ''}<div class="tscroll"><table class="tb ${opt.cls || ''}"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
// 요약 타일(.sum): [이름, 수, 주소, 띠(o 여유 · w 임박 · c 초과 · p 진행), 단위]
const sum = tiles => `<div class="sum">${tiles.map(([t, n, h, c, u, sub]) => `<div class="${c || ''} ${h ? 'go' : ''}" ${h ? `data-h="${h}" role="link" tabindex="0"` : ''}><small>${t}</small><b>${typeof n === 'number' ? n.toLocaleString() : n}${u ? `<em>${u}</em>` : ''}</b>${sub ? `<p>${sub}</p>` : ''}</div>`).join('')}</div>`;

      ['출처', srcChips([...new Set(base.map(i => i.plan))]) + `<span class="bnote">기획마다 가장 늦은 차수의 테스트결과 엑셀에서 모았습니다. 상태는 정본 엑셀이 정합니다. 결정은 <a href="#/decide">결정 회의</a>에서 고릅니다. 기준: ${gd09()}</span>`]]);
    const cols = [{h: 'ID', cls: 'id', w: '130px', v: i => esc(i.id)}, {h: '제목', v: i => `<span class="ttl">${esc(i.title || '-')}</span>${plan ? '' : `<div class="sub">${esc(planBy(i.plan).title)}</div>`}`}, {h: extra, cls: 'nw opt', w: kind === 'todo' ? '170px' : '130px', v: i => esc(kind === 'todo' ? stepName(i.cat) || '-' : i.cat || '-')}];
    if (kind === 'defect') cols.push({h: '심각도', cls: 'nw', w: '90px', v: i => sev(i.sev)});

    listView($('#ilist'), {rows: rs, key: i => i.id, cols, dim: i => !i.open, tbar: tbar(), empty: '조건에 맞는 이슈가 없습니다.',

        $('#i-plan').onchange = e => { location.hash = `#/issues/${e.target.value}/${kind}`; };
        $('#i-state').onclick = e => { const b = e.target.closest('[data-v]'); if (b){ IF.state = b.dataset.v; draw(); } };
        $('#i-owner').onchange = e => { IF.owner = e.target.value; draw(); };
        if ($('#i-sev')) $('#i-sev').onchange = e => { IF.sev = e.target.value; draw(); };
        const inp = $('#i-q'); inp.oninput = () => { IF.q = inp.value.trim().toLowerCase(); draw(inp.selectionStart); };
        if (focusQ !== undefined){ inp.focus(); inp.setSelectionRange(focusQ, focusQ); }

  };
  $('#isum').onclick = e => { const b = e.target.closest('[data-rst]'); if (!b) return; const r = b.dataset.rst;
    if (r === 'plan'){ location.hash = `#/issues/all/${kind}`; return; }
    if (r === 'state') IF.state = 'open'; else IF[r] = ''; draw(); };
  $('#isum').addEventListener('click', e => { if (e.target.closest('[data-old]')){ IF.old = true; draw(); } });
  draw();
}

// ───────── 길 찾기 ─────────
let lastR = '';
function route(){
  const bare = location.hash.replace(/^#/, '');
  if (bare && !bare.includes('/') && D.plans.some(p => p.key === bare)){ location.replace('#/plan/' + bare); return; }
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const [r, a, b] = h.split('/');
  const list = r === 'issues' || r === 'issue' || r === 'open' || (r === 'plan' && (b === 'open' || b === 'qa' || !b || b === 'overview'));
  if (!list || r !== lastR){ DW.sel = ''; panel(''); LD = null; }
  let active = '#/', sec = 'home';
  if (r === 'plan'){ vPlan(a, b); active = '#/plan/' + a; sec = 'plans'; }
  else if (r === 'plans'){ vPlans(a); sec = 'plans'; }
  else if (r === 'doc'){
    const rest = h.slice(4); let id = rest, target = '';
    if (!byDoc[rest]){ const k = rest.lastIndexOf('/'); id = rest.slice(0, k); target = rest.slice(k + 1); }
    vDoc(id, target); active = '#/doc/' + enc(id);
    const d = byDoc[id]; sec = !d ? 'home' : d.id === 'GD-09' ? 'qa' : d.kind === 'guide' ? 'guides' : 'policies';
  }
  else if (r === 'id'){ vId(a); sec = ''; }
  else if (r === 'decide'){ vDecide(); active = '#/decide'; sec = 'open'; }
  else if (r === 'open'){ vOpen(a); active = '#/open/' + (POL_OG.includes(OF.g) ? 'all' : OF.g); sec = POL_OG.includes(OF.g) ? 'policies' : 'open'; }
  else if ((r === 'issues' && b === 'decision') || (r === 'issue' && (D.issues.find(x => x.id === a) || {}).kind === 'decision')){ if (r === 'issue') OF.q = ''; vOpen('qa', r === 'issue' ? a : ''); active = '#/open/qa'; sec = 'open'; }
  else if (r === 'search'){ vSearch(h.slice(7)); sec = ''; }
  else if (r === 'ui'){ vUi(a, b); active = '#/ui'; sec = 'qa'; }
  else if (r === 'qa'){ vQa(a); active = a ? '#/qa/' + a : '#/qa'; sec = 'qa'; }
  else if (r === 'issues'){ if (lastR !== 'issues' && lastR !== 'issue') Object.assign(IF, {state: 'open', owner: '', sev: '', q: '', old: false}); vIssues(a, b, h.split('/')[3]); active = b === 'todo' ? '#/issues/all/todo' : '#/issues'; sec = 'qa'; }
  else if (r === 'issue'){ const it = D.issues.find(x => x.id === a); Object.assign(IF, {state: it && !it.open ? 'all' : 'open', owner: '', sev: '', q: '', old: !!(it && DECIDE_CATS.includes(it.cat))}); vIssues(it ? it.plan : '', it ? it.kind : '', '', it ? it.id : ''); active = '#/issues'; sec = 'qa'; }
  else if (r === 'policies'){ vPolicies(a); sec = 'policies'; active = a ? '#/policies/' + enc(a) : ''; if (a) setTimeout(() => { const t = document.getElementById('pg-' + enc(a)); if (t && t.nextElementSibling) t.nextElementSibling.scrollIntoView({block: 'start'}); }, 60); }
  else if (r === 'guides'){ vGuides(); sec = 'guides'; }
  else if (r === 'help'){ vHelp(); sec = 'guides'; active = '#/help'; }
  else vHome();
  lastR = r;
  nav(sec, active);
  drawBand();
  setTimeout(() => { rzScan(); markGo(); }, 0);
  if (!/doc\/.+\/./.test(h) && !(r === 'policies' && a)) $('#pg').scrollTop = 0;
}
// ───────── 표: 열 너비 끌어서 바꾸기 · 가로 스크롤 ─────────
// 표 머리 칸 오른쪽 경계를 끌면 그 열 너비가 바뀐다. 두 번 누르면 처음 너비로 돌아간다.
// 열을 넓혀 표가 칸보다 넓어지면 표 상자 안에서 가로로 스크롤한다.
function enableResize(tb){
  if (tb.dataset.rz) return; tb.dataset.rz = '1';
  const ths = [...tb.querySelectorAll('thead th')]; if (ths.length < 2) return;
  let cg = tb.querySelector('colgroup');
  const w0 = ths.map(th => th.getBoundingClientRect().width);
  if (!w0.some(w => w > 0)) { delete tb.dataset.rz; return; }      // 아직 화면에 없는 표는 다음에
  if (!cg){ cg = document.createElement('colgroup'); cg.innerHTML = ths.map(() => '<col>').join(''); tb.prepend(cg); }
  const cols = [...cg.children];
  const fix = () => { cols.forEach((c, i) => { c.style.width = Math.round(w0[i]) + 'px'; }); tb.style.tableLayout = 'fixed'; tb.style.width = Math.round(w0.reduce((a, b) => a + b, 0)) + 'px'; tb.style.minWidth = '100%'; };
  let fixed = false;
  ths.forEach((th, i) => {
    const h = document.createElement('span'); h.className = 'rz'; h.title = '끌어서 열 너비 바꾸기 · 두 번 누르면 처음대로'; th.appendChild(h);
    h.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      if (!fixed){ fix(); fixed = true; }
      const x0 = e.clientX, c0 = parseFloat(cols[i].style.width), t0 = parseFloat(tb.style.width);
      h.setPointerCapture(e.pointerId); tb.classList.add('rzing');
      const mv = ev => { const w = Math.max(48, c0 + ev.clientX - x0); cols[i].style.width = w + 'px'; tb.style.width = (t0 + w - c0) + 'px'; };
      const up = () => { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); tb.classList.remove('rzing'); };
      h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
    });
    h.addEventListener('click', e => e.stopPropagation());
    h.addEventListener('dblclick', e => { e.stopPropagation(); if (!fixed) return; cols[i].style.width = Math.round(w0[i]) + 'px'; tb.style.width = Math.round(w0.reduce((a, b) => a + b, 0) - w0[i] + w0[i]) + 'px'; const sum = cols.reduce((a, c) => a + parseFloat(c.style.width), 0); tb.style.width = sum + 'px'; });
  });
  // 행에서도 열 경계(칸 오른쪽 5px)에 마우스를 올리면 끌어서 열 너비를 바꾼다
  const tbody = tb.tBodies[0];
  if (tbody){
    const edge = e => { const td = e.target.closest('td'); if (!td || td.cellIndex >= cols.length - 1 && td.cellIndex !== cols.length - 1) return -1; const r = td.getBoundingClientRect(); return r.right - e.clientX <= 5 && r.right - e.clientX >= -1 ? td.cellIndex : -1; };
    tbody.addEventListener('pointermove', e => { if (tb.classList.contains('rzing')) return; tbody.classList.toggle('rzedge', edge(e) >= 0); });
    tbody.addEventListener('pointerleave', () => tbody.classList.remove('rzedge'));
    tbody.addEventListener('pointerdown', e => {
      const i = edge(e); if (i < 0) return;
      e.preventDefault(); e.stopPropagation();
      if (!fixed){ fix(); fixed = true; }
      const x0 = e.clientX, c0 = parseFloat(cols[i].style.width), t0 = parseFloat(tb.style.width);
      tbody.setPointerCapture(e.pointerId); tb.classList.add('rzing');
      const mv = ev => { const w = Math.max(48, c0 + ev.clientX - x0); cols[i].style.width = w + 'px'; tb.style.width = (t0 + w - c0) + 'px'; };
      const up = () => { tbody.removeEventListener('pointermove', mv); tbody.removeEventListener('pointerup', up); tb.classList.remove('rzing'); tbody.classList.remove('rzedge'); };
      tbody.addEventListener('pointermove', mv); tbody.addEventListener('pointerup', up);
    }, true);
    tbody.addEventListener('click', e => { if (tb.classList.contains('rzjust')){ e.stopPropagation(); tb.classList.remove('rzjust'); } }, true);
  }
}
const rzScan = () => document.querySelectorAll('table.tb, table.rtable').forEach(enableResize);
// 다른 쪽으로 넘어가는 링크에 → 아이콘을 붙인다. 표의 행을 누르면 열리는 상세 패널과 구분한다
const GO_SKIP = '.ptabs a, .rbox .kv, .crumb a, .btn, .bdg, .gdoc, .lead-doc, .pcard .h a, .nums a, .toc a, .toc button, .sum .go, a.rid, .refn, .sec > a, .card > .hd > span a, .stageboard a, .chips a';
const FT = {xlsx: 'XLS', xls: 'XLS', csv: 'CSV', md: 'MD', html: 'HTML', pdf: 'PDF', zip: 'ZIP', json: 'JSON', png: 'PNG'};
// 링크 표시: 새 창(↗) · 다른 쪽으로 이동(→) · 받기(파일 형식 아이콘). 옆 패널을 여는 행은 CSS 가 패널 아이콘을 단다
function markLinks(){ document.querySelectorAll('#page a[href], #pnl a[href], #band a[href]').forEach(a => {
  if (a.dataset.lk) return; a.dataset.lk = '1'; const h = a.getAttribute('href') || '', m = h.match(/\.([a-z0-9]+)(?:$|[?#])/i), ext = m && FT[m[1].toLowerCase()] ? m[1].toLowerCase() : '';
  if (!h.startsWith('#') && (a.hasAttribute('download') || ext)){
    const e = ext || 'file', ic = `<i class="ft ft-${e}" aria-hidden="true">${FT[e] || '파일'}</i>`, old = a.querySelector(':scope > svg.ic');
    if (old) old.outerHTML = ic; else a.insertAdjacentHTML('afterbegin', ic); a.classList.add('fl');
    if (a.target === '_blank'){ a.classList.add('ext'); a.innerHTML = a.innerHTML.replace(/\s*↗\s*$/, ''); }
  } else if (a.target === '_blank' || /^https?:/.test(h)){
    a.innerHTML = a.innerHTML.replace(/\s*↗\s*$/, ''); const old = a.querySelector(':scope > svg.ic'); if (old && /i-ext/.test(old.innerHTML)) old.remove(); a.classList.add('ext');
  } }); }
function fitTables(){
  // 표는 페이지와 함께 스크롤한다(안쪽 세로 스크롤을 만들지 않음). 가로로 넘칠 때만 표 상자가 가로 스크롤을 갖는다
  document.querySelectorAll('#page .card>.tscroll').forEach(t => { if (t.closest('.md')) return;
    t.style.maxHeight = '';
    const tb = t.querySelector('table');
    t.classList.toggle('fits', !tb || tb.scrollWidth <= t.clientWidth + 1);
    if (tb && !tb.__ro){ tb.__ro = new ResizeObserver(() => t.classList.toggle('fits', tb.scrollWidth <= t.clientWidth + 1)); tb.__ro.observe(tb); } });
}
addEventListener('resize', () => { clearTimeout(window.__ft); window.__ft = setTimeout(fitTables, 80); });
function markGo(){ fitTables(); markLinks(); document.querySelectorAll('#page a[href^="#/"], #pnl a[href^="#/"]').forEach(a => { if (a.dataset.go || a.matches(GO_SKIP)) return; a.dataset.go = '1'; a.classList.add('go'); }); }
let rzT = 0; new MutationObserver(() => { clearTimeout(rzT); rzT = setTimeout(() => { rzScan(); markGo(); }, 30); }).observe(document.body, {childList: true, subtree: true});
window.addEventListener('hashchange', route);
// 맨 위로: 한 화면 높이 넘게 내려가면 오른쪽 아래에 나타남. 누르면 맨 위로 가고 검색 칸(있으면)으로 포커스
(() => {
  const b = document.createElement('button'); b.type = 'button'; b.id = 'totop'; b.title = '맨 위로'; b.setAttribute('aria-label', '맨 위로');
  b.innerHTML = '<svg class="ic"><use href="#i-up"/></svg>'; document.body.append(b);
  const pg = $('#pg'), y = () => Math.max(pg.scrollTop, window.scrollY || document.documentElement.scrollTop);
  const upd = () => b.classList.toggle('on', y() > innerHeight * 0.8);
  pg.addEventListener('scroll', upd, {passive: true}); addEventListener('scroll', upd, {passive: true}); addEventListener('hashchange', () => setTimeout(upd, 50));
  b.onclick = () => { pg.scrollTo({top: 0, behavior: 'smooth'}); window.scrollTo({top: 0, behavior: 'smooth'});
    const q = $('#page input[type=search]'); if (q) setTimeout(() => q.focus({preventScroll: true}), 350); };
})();
route();

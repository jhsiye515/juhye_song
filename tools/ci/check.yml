name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl python-docx
      - name: 기획 목록 · ID 검사
        run: python3 tools/check/lists.py --all
      - name: 문서 포털 빌드
        run: python3 tools/site/build.py . site
